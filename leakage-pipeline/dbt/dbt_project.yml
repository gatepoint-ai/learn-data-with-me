name: leakage
version: "0.1.0"
profile: leakage

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  data_dir: "../data"          # where generate/generate.py writes the CSVs
  unbilled_threshold: 0.10     # mart_unbilled_usage.is_flagged
  rating_threshold: 0.01       # mart_rating_variance.is_flagged

models:
  leakage:
    staging:
      +materialized: view
    marts:
      +materialized: table
